name: build-nocheck

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: gradle build --no-daemon --console=plain --stacktrace

      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nocheck-jars
          if-no-files-found: warn
          path: build/libs/*.jar
